apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: vyntra
data:
  01-service-databases.sql: |
    CREATE DATABASE IF NOT EXISTS vyntra_user CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS vyntra_business CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS vyntra_shop CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS vyntra_product CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS vyntra_order CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    GRANT ALL PRIVILEGES ON vyntra_user.* TO 'vyntra'@'%';
    GRANT ALL PRIVILEGES ON vyntra_business.* TO 'vyntra'@'%';
    GRANT ALL PRIVILEGES ON vyntra_shop.* TO 'vyntra'@'%';
    GRANT ALL PRIVILEGES ON vyntra_product.* TO 'vyntra'@'%';
    GRANT ALL PRIVILEGES ON vyntra_order.* TO 'vyntra'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: vyntra
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: vyntra
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vyntra-runtime
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: vyntra_user
            - name: MYSQL_USER
              value: vyntra
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vyntra-runtime
                  key: mysql-app-password
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
