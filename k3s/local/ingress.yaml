apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vyntra
  namespace: vyntra
spec:
  ingressClassName: traefik
  rules:
    - host: api.vyntra.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
