apiVersion: v1
kind: Namespace
metadata:
  name: x-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: x-platform
type: Opaque
stringData:
  root-password: "XProd_Root_2026!"
---
apiVersion: v1
kind: Secret
metadata:
  name: x-app-database
  namespace: x-platform
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "x_prod"
  SPRING_DATASOURCE_PASSWORD: "Passw0rd123$$$"
---
apiVersion: v1
kind: Secret
metadata:
  name: x-app-auth
  namespace: x-platform
type: Opaque
stringData:
  JWT_SECRET: "x-prod-jwt-secret-change-me-32chars"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: x-platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: x-platform
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS x_dev CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS x_prod CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS 'x_dev'@'%' IDENTIFIED BY 'Passw0rd123$$$';
    CREATE USER IF NOT EXISTS 'x_prod'@'%' IDENTIFIED BY 'Passw0rd123$$$';
    GRANT ALL PRIVILEGES ON x_dev.* TO 'x_dev'@'%';
    GRANT ALL PRIVILEGES ON x_prod.* TO 'x_prod'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: x-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: x-platform
spec:
  type: NodePort
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: x-platform
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: x-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
